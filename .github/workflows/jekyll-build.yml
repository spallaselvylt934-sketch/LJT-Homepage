name: Jekyll build

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read
  pages: write

concurrency:
  group: jekyll-pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.2"
          bundler-cache: true

      - name: Build site
        run: bundle exec jekyll build --strict_front_matter
        env:
          JEKYLL_ENV: production

      - name: Check homepage and publications
        run: |
          ruby -r_relative检查 -e 'exit 1'
